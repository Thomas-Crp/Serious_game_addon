<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logic Bomb</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<p id="titre">LOGIC_BOMB.EXE</p>

<!-- ECRAN 1 : les joueurs -->
<div id="ecran-joueurs">
  <h1>NEW GAME</h1>
  <p>NUMBER OF PLAYERS:</p>
  <input type="number" id="nombre" min="2" max="8" value="2">
  <button id="btn-nombre">CONFIRM</button>
  <div id="liste-noms"></div>
  <button id="btn-commencer">START</button>
</div>

<!-- ECRAN 2 : le theme -->
<div id="ecran-theme">
  <h1 id="round-theme">ROUND 1 / 6</h1>
  <button id="btn-theme">DRAW A THEME</button>
  <img id="carte" src="" alt="theme card">
  <p id="nom-theme"></p>
  <p id="consigne">DRAW A CARD, THEN CONFIRM</p>
  <button id="btn-valider">CONFIRM</button>
</div>

<!-- ECRAN 3 : le jeu -->
<div id="ecran-jeu">
  <p id="round-jeu">ROUND 1 / 6</p>
  <p id="statut">STATUS: DORMANT</p>
  <p id="tour">NOW PLAYING:</p>
  <p id="chrono">00:20</p>

  <div id="boite">
    <img id="virus" src="assets/virus_logo.svg" alt="virus">
    <p id="message">SYSTEM COMPROMISED</p>
  </div>

  <p id="aide">PRESS SPACE WHEN YOU FIND YOUR WORD</p>
  <button id="btn-pause">PAUSE</button>
  <button id="bouton">NEXT PLAYER</button>
</div>

<!-- ECRAN 4 : fin du round ou fin de la partie -->
<div id="ecran-fin">
  <h1 id="titre-fin">END OF ROUND 1</h1>
  <p>BUGS PER PLAYER:</p>
  <ul id="scores"></ul>
  <button id="btn-suivant">NEXT ROUND</button>
</div>

<script src="script.js"></script>
</body>
</html>
